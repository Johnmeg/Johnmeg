# /etc/nginx/conf.d/sac-data-loader.conf
# Reemplace cargas-sac.ciudadlimpia.com y las rutas del certificado.

server {
    listen 80;
    server_name cargas-sac.ciudadlimpia.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cargas-sac.ciudadlimpia.com;

    ssl_certificate     /etc/ssl/certs/cargas-sac.crt;
    ssl_certificate_key /etc/ssl/private/cargas-sac.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 25 MB: un poco más que MAX_FILE_MB=20
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La validación en SAC de archivos grandes puede tardar
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
